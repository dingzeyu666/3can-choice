<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b08d57">
<meta name="description" content="三餐签筒 · 今天吃什么,抽个签吧">
<title>三餐签筒</title>
<style>
  :root{
    --gold:#b08d57; --gold-l:#d8b877; --gold-soft:#f3e7d2;
    --lav:#8e7cc3; --lav-soft:#ede8f7;
    --ink:#2e2a33; --muted:#8a8090; --card:rgba(255,255,255,.72);
    --line:rgba(255,255,255,.65); --shadow:0 12px 40px rgba(120,90,40,.12);
    --radius:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f7f3ee; color:var(--ink); min-height:100vh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(58% 42% at 12% 8%, rgba(216,184,119,.28), transparent 62%),
      radial-gradient(50% 38% at 90% 6%, rgba(142,124,195,.22), transparent 60%),
      radial-gradient(65% 45% at 55% 100%, rgba(232,201,216,.30), transparent 62%),
      linear-gradient(180deg,#faf6ef 0%,#f5f1f8 100%);
  }
  .header{position:relative;overflow:hidden;text-align:center;padding:calc(34px + env(safe-area-inset-top)) 20px 24px}
  .header::before{
    content:"♎";position:absolute;right:-14px;top:6px;font-size:110px;
    opacity:.10;transform:rotate(12deg);line-height:1;
  }
  .crown{font-size:15px;letter-spacing:6px;color:var(--gold);font-weight:600}
  .header h1{
    font-family:"Noto Serif SC","Songti SC",STSong,serif;
    font-size:34px;letter-spacing:8px;margin-top:6px;font-weight:700;
    background:linear-gradient(120deg,#8e7cc3 10%,#b08d57 45%,#c98b7a 75%,#8e7cc3 100%);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;animation:shine 6s linear infinite;
  }
  @keyframes shine{to{background-position:200% center}}
  .header .sub{margin-top:10px;font-size:13px;color:var(--muted);letter-spacing:2px}
  .header .date-chip{
    display:inline-flex;align-items:center;gap:6px;margin-top:14px;
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 16px;font-size:13px;box-shadow:0 4px 16px rgba(120,90,40,.08);
  }
  .wrap{padding:20px 16px 0}
  .draw-wrap{text-align:center;padding:8px 0 4px}
  .draw-hint{font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:22px}
  .draw-btn{
    position:relative;width:128px;height:128px;border:none;cursor:pointer;
    border-radius:50%;color:#fff;font-size:20px;font-weight:700;letter-spacing:6px;
    font-family:"Noto Serif SC","Songti SC",STSong,serif;
    background:radial-gradient(circle at 32% 28%,#e6c98a,#b08d57 55%,#8a6a3c);
    box-shadow:0 14px 44px rgba(176,141,87,.45),inset 0 2px 6px rgba(255,255,255,.5);
    transition:transform .2s;
  }
  .draw-btn::before{
    content:"";position:absolute;inset:-8px;border-radius:50%;
    border:1px solid rgba(176,141,87,.55);animation:pulse 2.4s ease-out infinite;
  }
  .draw-btn:active{transform:scale(.94)}
  .draw-btn.shaking{animation:shake .45s ease-in-out infinite}
  @keyframes shake{
    0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) translateY(-2px)}
    50%{transform:rotate(0) translateY(0)}75%{transform:rotate(4deg) translateY(-2px)}
  }
  @keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.28);opacity:0}}
  .draw-btn small{display:block;font-size:11px;letter-spacing:2px;opacity:.9;margin-top:2px}
  .draw-btn.shaking small{display:none}
  .shaking-text{display:none;font-size:12px;letter-spacing:3px}
  .draw-btn.shaking .shaking-text{display:block}

  .meals{margin-top:26px}
  .meal-card{
    position:relative;overflow:hidden;
    background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;margin-bottom:12px;
    box-shadow:var(--shadow);transition:border-color .3s;
    animation:cardIn .5s cubic-bezier(.2,.8,.3,1.1) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  .meal-card.revealed{border-color:rgba(176,141,87,.55);box-shadow:0 14px 44px rgba(176,141,87,.22)}
  .meal-card.roll{animation:roll 1.6s ease-in-out}
  @keyframes roll{
    0%{transform:rotate(0)}30%{transform:rotate(-1.5deg) translateX(-3px)}
    60%{transform:rotate(1.5deg) translateX(3px)}100%{transform:rotate(0)}
  }
  .meal-top{display:flex;align-items:center;gap:14px}
  .meal-ico{
    width:52px;height:52px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:linear-gradient(135deg,var(--gold-soft),var(--lav-soft));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);
  }
  .meal-info{flex:1;min-width:0}
  .meal-time{font-size:11px;color:var(--muted);letter-spacing:3px}
  .meal-name{
    font-family:"Noto Serif SC","Songti SC",STSong,serif;
    font-size:20px;font-weight:700;margin-top:3px;letter-spacing:1px;
  }
  .meal-name.rolling{color:var(--lav)}
  .dish-blocks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .dish-main{
    font-size:13px;font-weight:700;color:#7a4f1d;letter-spacing:.5px;
    background:linear-gradient(135deg,rgba(216,184,119,.35),rgba(216,184,119,.18));
    border:1px solid rgba(176,141,87,.5);border-radius:99px;padding:4px 12px;
  }
  .dish-sub{
    font-size:12px;color:#6b5f6e;letter-spacing:.5px;
    background:rgba(142,124,195,.10);border:1px solid rgba(142,124,195,.25);
    border-radius:99px;padding:4px 11px;
  }
  .slot-btn{
    width:38px;height:38px;flex:none;border-radius:50%;border:1px solid rgba(176,141,87,.4);
    background:rgba(255,255,255,.5);color:var(--gold);cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;transition:.2s;
  }
  .slot-btn:active{transform:scale(.85);background:var(--gold-soft)}
  .slot-btn.on{background:linear-gradient(135deg,#d8b877,#b08d57);color:#fff;box-shadow:0 4px 14px rgba(176,141,87,.4)}
  .meal-detail{max-height:0;overflow:hidden;transition:max-height .4s ease}
  .meal-detail.open{max-height:320px;margin-top:12px}
  .nu-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{
    font-size:11px;padding:4px 10px;border-radius:99px;letter-spacing:.5px;
    background:linear-gradient(135deg,var(--gold-soft),var(--lav-soft));
    color:#7a5a2e;border:1px solid rgba(176,141,87,.25);
  }
  .recipe{
    font-size:12.5px;line-height:1.8;color:#6b5f6e;margin-top:10px;
    background:rgba(255,255,255,.5);border-radius:12px;padding:10px 12px;
    border:1px dashed rgba(176,141,87,.35);
  }
  .recipe b{color:var(--gold);font-weight:700}
  .toggle-row{display:flex;align-items:center;gap:8px;margin-top:10px}
  .toggle-detail{
    border:none;background:transparent;color:var(--gold);font-size:12px;cursor:pointer;
    letter-spacing:1px;padding:4px 0;
  }
  .lottery-tag{
    font-size:10.5px;color:var(--gold);letter-spacing:2px;font-weight:600;
    opacity:0;transition:.4s;
  }
  .lottery-tag.show{opacity:1}
  .bottom-actions{display:flex;gap:10px;margin-top:18px}
  .btn{
    flex:1;border:none;cursor:pointer;border-radius:14px;padding:13px 0;font-size:14px;font-weight:600;
    letter-spacing:2px;transition:.2s;
  }
  .btn:active{transform:scale(.97)}
  .btn-gold{background:linear-gradient(135deg,#d8b877,#b08d57);color:#fff;box-shadow:0 8px 24px rgba(176,141,87,.4)}
  .btn-ghost{background:var(--card);color:var(--muted);border:1px solid var(--line);box-shadow:0 4px 14px rgba(120,90,40,.08)}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
  .tip{
    background:linear-gradient(135deg,rgba(243,231,210,.9),rgba(237,232,247,.9));
    border:1px solid rgba(176,141,87,.25);border-radius:14px;padding:12px 14px;
    font-size:12.5px;color:#7a5a2e;margin-top:16px;line-height:1.8;letter-spacing:.5px;
  }
  .share-btn{
    display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:14px;
    background:linear-gradient(135deg,#8e7cc3,#b08d57);color:#fff;font-size:15px;font-weight:700;
    letter-spacing:3px;cursor:pointer;box-shadow:0 10px 30px rgba(142,124,195,.35);transition:.2s;
  }
  .share-btn:active{transform:scale(.98)}
  .toast{
    position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:rgba(46,42,51,.92);color:#fff;font-size:13px;letter-spacing:1px;
    padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:99;
    box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:82%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="header">
  <div class="crown">♎ · L I B R A</div>
  <h1>三餐签筒</h1>
  <div class="sub">今日宜食 · 抽一支好签</div>
  <div class="date-chip" id="dateChip"></div>
  <div style="margin-top:8px;font-size:11px;color:rgba(176,141,87,.75);letter-spacing:2px">v7</div>
</div>

<div class="wrap">
  <div class="draw-wrap">
    <div class="draw-hint" id="drawHint">心诚则灵 · 轻轻一按</div>
    <button class="draw-btn" id="drawBtn" onclick="doDraw()">抽 签<small>三餐定数</small><span class="shaking-text">摇 签 中</span></button>
  </div>

  <div class="meals" id="mealList"></div>

  <div class="bottom-actions" id="bottomActions" style="display:none">
    <button class="btn btn-ghost" id="undoBtn" onclick="undoDraw()" disabled>↩ 反悔</button>
    <button class="btn btn-ghost" onclick="redrawAll()">🔄 全部重抽</button>
  </div>

  <div class="tip" id="drawTip"></div>

  <button class="share-btn" onclick="shareToday()">📤 分享今日食谱</button>
</div>

<div class="toast" id="toast"></div>

<script>
var MEALS = {
  breakfast: [
    {n:"鲜肉小笼包",s:"配 豆浆 · 凉拌菠菜",nu:["蛋白18g","碳水45g","纤维4g"],r:"和面醒发,肉末加葱姜调料拌匀,擀皮包小褶,上笼蒸8分钟;菠菜焯水拌香醋。"},
    {n:"燕麦牛奶粥",s:"配 水煮蛋 · 蓝莓",nu:["蛋白15g","碳水40g","维生素C"],r:"燕麦片加水小火煮5分钟,倒入牛奶微沸;鸡蛋煮7分钟,蓝莓洗净点缀。"},
    {n:"皮蛋瘦肉粥",s:"配 黄瓜条 · 小油条",nu:["蛋白16g","碳水42g","纤维3g"],r:"大米熬至开花,加腌好的肉丝和皮蛋丁煮3分钟,白胡椒调味;黄瓜拍碎拌蒜。"},
    {n:"煎饼果子",s:"配 无糖酸奶 · 苹果片",nu:["蛋白14g","碳水48g","膳食纤维"],r:"绿豆面调糊摊薄饼,磕蛋抹开撒葱花芝麻,翻面刷酱,夹生菜脆饼卷起。"},
    {n:"鸡蛋灌饼",s:"配 小米粥 · 圣女果",nu:["蛋白16g","碳水40g","维生素A"],r:"面团擀片抹油,煎至鼓起灌入蛋液,翻面烙熟,卷生菜刷酱;小米粥配圣女果。"},
    {n:"广式肠粉",s:"配 瘦肉粥 · 白灼生菜",nu:["蛋白15g","碳水45g","纤维3g"],r:"米浆摊盘蒸1分钟,铺蛋液虾仁再蒸,卷起淋豉油;生菜焯水淋蒸鱼豉油。"},
    {n:"豆腐脑",s:"配 芝麻烧饼 · 猕猴桃",nu:["蛋白12g","碳水50g","维生素C"],r:"内酯豆腐蒸热,浇香菇木耳卤,点香油辣椒油;烧饼夹芝麻酱,配猕猴桃。"},
    {n:"鲜肉馄饨",s:"配 煎蛋 · 小番茄",nu:["蛋白18g","碳水42g","纤维2g"],r:"馄饨皮包肉馅捏紧,紫菜虾皮冲汤底,煮2分钟盛出点香油;煎蛋配小番茄。"},
    {n:"韭菜盒子",s:"配 玉米糊 · 橙子",nu:["蛋白10g","碳水46g","维生素C"],r:"韭菜切碎拌炒蛋粉丝,烫面皮包半月形,平底锅少油煎至两面金黄。"},
    {n:"虾仁蒸饺",s:"配 牛奶 · 水蜜桃",nu:["蛋白16g","碳水38g","钙"],r:"虾仁剁粒拌肉馅,饺皮包柳叶褶,大火蒸8分钟;牛奶温热配水蜜桃。"},
    {n:"葱油拌面",s:"配 溏心蛋 · 葡萄",nu:["蛋白13g","碳水52g","钾"],r:"小葱炸至焦黄,淋酱油糖熬葱油;面条煮好拌油撒葱花;溏心蛋对半切。"},

    {n:"燕麦苹果粥",s:"配 坚果 · 低脂奶",nu:["蛋白12g","碳水45g","膳食纤维"],r:"燕麦加水煮开,放苹果丁和肉桂粉小火5分钟,撒核桃碎。"},
    {n:"糯米烧麦",s:"配 紫菜蛋汤 · 梨",nu:["蛋白14g","碳水44g","铁"],r:"糯米提前蒸熟拌香菇肉丁酱油,饺子皮捏成烧麦形,蒸8分钟;蛋汤配梨。"},
    {n:"粢饭团",s:"配 豆浆 · 草莓",nu:["蛋白13g","碳水50g","维生素C"],r:"糯米饭摊开,夹油条肉松咸蛋黄卷紧切段;豆浆配草莓。"},

    {n:"吐司煎蛋",s:"配 希腊酸奶 · 蓝莓",nu:["蛋白17g","碳水40g","抗氧化"],r:"吐司挖孔煎蛋,双面煎至金黄;酸奶淋蜂蜜拌蓝莓。"},

    {n:"腊汁肉夹馍",s:"配 南瓜粥 · 西瓜",nu:["蛋白18g","碳水48g","纤维3g"],r:"五花肉卤2小时剁碎,青椒香菜拌匀,夹入烤脆的馍。"},
    {n:"鸡蛋汉堡",s:"配 牛奶 · 苹果",nu:["蛋白16g","碳水44g","钙"],r:"面糊倒入模具,加蛋加肉末,煎至两面金黄微焦。"},

    {n:"培根煎蛋",s:"配 烤吐司 · 橙汁",nu:["蛋白18g","碳水38g","维生素C"],r:"培根小火煎脆,鸡蛋煎太阳蛋,吐司烤至金黄,配鲜榨橙汁。"},
    {n:"鲜鱼片粥",s:"配 油条 · 拌黄瓜",nu:["蛋白16g","碳水42g","DHA"],r:"大米煮开花,下腌制鱼片烫熟,撒姜丝葱花白胡椒。"},
    {n:"牛肉包子",s:"配 小米粥 · 梨",nu:["蛋白17g","碳水46g","纤维3g"],r:"牛肉馅加洋葱酱油调味,发面包制,蒸12分钟;小米粥配梨。"}
  ],
  lunch: [
    {n:"宫保鸡丁",s:"配 杂粮饭 · 蒜蓉西兰花 · 冬瓜汤",nu:["蛋白28g","碳水60g","纤维6g"],r:"鸡丁上浆滑油,干辣椒花生爆香,糖醋汁勾芡裹匀;西兰花焯水拌蒜蓉。"},
    {n:"红烧牛肉面",s:"配 卤蛋 · 烫青菜",nu:["蛋白30g","碳水65g","铁"],r:"牛腩焯水炒糖色,加香料炖1.5小时,浇在面上,配卤蛋青菜。"},

var CYCLE = 30;
var EPOCH = new Date(2026, 0, 1);
var today = new Date(); today.setHours(0,0,0,0);

var HISTORY_KEY = "sancan_history_v2";
var DRAWN_KEY = "sancan_drawn_v2";
var drawn = loadJSON(DRAWN_KEY, {breakfast:null, lunch:null, dinner:null, date:null});
var undoStack = [];
var rolling = false;
var openDetail = {breakfast:false, lunch:false, dinner:false};

function pad(n){return n<10?"0"+n:""+n}
function fmtDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmtCN(d){
  var w=["日","一","二","三","四","五","六"][d.getDay()];
  return d.getMonth()+1+"月"+d.getDate()+"日 · 星期"+w;
}
function loadJSON(k, fb){
  try{var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb;}catch(e){return fb}
}
function save(key, val){
  try{localStorage.setItem(key, JSON.stringify(val));}catch(e){}
}
function usedPool(){
  var h = loadJSON(HISTORY_KEY, {breakfast:[],lunch:[],dinner:[]});
  if (drawn.date !== fmtDate(today)) {
    drawn = {breakfast:null, lunch:null, dinner:null, date:fmtDate(today)};
    save(DRAWN_KEY, drawn);
  }
  return h;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function pick(slot, exclude){
  var pool = MEALS[slot].filter(function(x){return exclude.indexOf(x.n)<0});
  if (!pool.length) pool = MEALS[slot].slice();
  return pool[Math.floor(Math.random()*pool.length)];
}
function slotOf(k){return k==="breakfast"?"早餐":(k==="lunch"?"午餐":"晚餐")}
function icoOf(k){return k==="breakfast"?"🌅":(k==="lunch"?"☀️":"🌙")}
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(function(){t.classList.remove("show")}, 2200);
}

function renderHeader(){
  document.getElementById("dateChip").textContent = fmtCN(today);
}
function dishBlocks(d){
  var main = esc(d.n);
  var parts = String(d.s||"").replace(/^配\s*/,"").split("·");
  var html = '<span class="dish-main">'+main+'</span>';
  parts.forEach(function(p){
    p = p.trim();
    if (p) html += '<span class="dish-sub">'+esc(p)+'</span>';
  });
  return html;
}
function cardHTML(s){
  var d = drawn[s];
  var isOpen = d ? (openDetail[s] !== false) : false;
  var chips = "";
  if (d){
    (d.nu||[]).forEach(function(c){chips += '<span class="chip">'+esc(c)+'</span>'});
  }
  return '<div class="meal-card' + (d?' revealed':'') + '" id="card-'+s+'" onclick="cardTap(event,\''+s+'\')">' +
    '<div class="meal-top">' +
      '<div class="meal-ico">' + icoOf(s) + '</div>' +
      '<div class="meal-info">' +
        '<div class="meal-time">' + slotOf(s) + '</div>' +
        '<div class="meal-name' + (d?'':' rolling') + '" id="name-'+s+'">' + (d?esc(d.n):"待抽") + '</div>' +
        (d ? '<div class="dish-blocks">' + dishBlocks(d) + '</div>' : '<div class="meal-side">配菜 · 营养 · 做法 抽签后揭晓</div>') +
      '</div>' +
      '<button class="slot-btn' + (d?' on':'') + '" id="slot-'+s+'" onclick="event.stopPropagation();drawSlot(\''+s+'\')" title="'+(d?'重抽':'抽取')+'这一餐">↻</button>' +
    '</div>' +
    (d ? '<div class="meal-detail' + (isOpen?' open':'') + '" id="detail-'+s+'">' +
      '<div class="nu-chips">' + chips + '</div>' +
      '<div class="recipe"><b>做法</b> ' + esc(d.r) + '</div>' +
    '</div>' : '') +
    (d ? '<div class="toggle-row"><button class="toggle-detail" onclick="event.stopPropagation();toggleDetail(\''+s+'\')">' + (isOpen?'收起做法 ▴':'看具体做法 ▾') + '</button>' +
      '<span class="lottery-tag show">✨ 今日定数</span></div>' : '') +
  '</div>';
}
function renderDrawView(){
  var list = document.getElementById("mealList");
  var html = "";
  ["breakfast","lunch","dinner"].forEach(function(s){ html += cardHTML(s); });
  list.innerHTML = html;
  var done = drawn.breakfast && drawn.lunch && drawn.dinner;
  document.getElementById("bottomActions").style.display = done ? "flex" : "none";
  document.getElementById("undoBtn").disabled = !undoStack.length;
  var hint = document.getElementById("drawHint");
  if (done){
    hint.innerHTML = '🎉 三餐已定,去享用吧';
    document.getElementById("drawTip").innerHTML = '💡 每餐右侧的 ↻ 可单独重抽;「反悔」退回上一签;「全部重抽」一键换全套。已抽的菜会存入本地,30 天内尽量不重复。';
  } else {
    hint.innerHTML = '心诚则灵 · 轻轻一按';
    document.getElementById("drawTip").innerHTML = '💡 抽完的签会存入手机,刷新不丢;每餐可单独重抽,点菜名下方可看具体做法。';
  }
  document.getElementById("drawBtn").style.display = done ? "none" : "";
}
function doDraw(){
  if (rolling) return;
  rolling = true;
  var btn = document.getElementById("drawBtn");
  btn.classList.add("shaking");
  var slots = ["breakfast","lunch","dinner"].filter(function(s){return !drawn[s]});
  var h = usedPool();
  var picked = {};
  slots.forEach(function(s){ picked[s] = pick(s, h[s]); });
  var tick = 0;
  var timer = setInterval(function(){
    slots.forEach(function(s){
      var el = document.getElementById("name-"+s);
      if (el) el.textContent = MEALS[s][Math.floor(Math.random()*MEALS[s].length)].n;
    });
    tick++;
    if (tick >= 12){
      clearInterval(timer);
      btn.classList.remove("shaking");
      slots.forEach(function(s){
        drawn[s] = picked[s];
        h[s].push(picked[s].n);
        if (h[s].length > 24) h[s].shift();
        undoStack.push({slot:s, from:null, to:picked[s].n});
      });
      save(HISTORY_KEY, h);
      drawn.date = fmtDate(today);
      save(DRAWN_KEY, drawn);
      rolling = false;
      renderDrawView();
      slots.forEach(function(s){
        var card = document.getElementById("card-"+s);
        card.classList.add("roll");
        setTimeout(function(){card.classList.remove("roll")}, 1700);
      });
    }
  }, 130);
}
function drawSlot(s){
  if (rolling) return;
  var h = usedPool();
  var prev = drawn[s];
  var next = pick(s, h[s]);
  drawn[s] = next;
  undoStack.push({slot:s, from: prev ? prev.n : null, to: next.n});
  h[s].push(next.n);
  if (h[s].length > 24) h[s].shift();
  save(HISTORY_KEY, h);
  save(DRAWN_KEY, drawn);
  openDetail[s] = true;
  renderDrawView();
  var card = document.getElementById("card-"+s);
  card.classList.add("roll");
  setTimeout(function(){card.classList.remove("roll")}, 1700);
}
function undoDraw(){
  if (rolling || !undoStack.length) return;
  var step = undoStack.pop();
  var h = usedPool();
  var ix = -1;
  h[step.slot].forEach(function(x,i){ if (x===step.to && ix<0) ix = i; });
  if (ix >= 0) h[step.slot].splice(ix,1);
  if (step.from){
    var m = MEALS[step.slot].filter(function(x){return x.n===step.from})[0];
    drawn[step.slot] = m;
    h[step.slot].push(step.from);
  } else {
    drawn[step.slot] = null;
  }
  save(HISTORY_KEY, h);
  save(DRAWN_KEY, drawn);
  renderDrawView();
}
function redrawAll(){
  if (rolling) return;
  var h = usedPool();
  ["breakfast","lunch","dinner"].forEach(function(s){
    var prev = drawn[s];
    if (!prev) return;
    var next = pick(s, h[s].slice());
    drawn[s] = next;
    undoStack.push({slot:s, from:prev.n, to:next.n});
    h[s].push(next.n);
    if (h[s].length > 24) h[s].shift();
  });
  save(HISTORY_KEY, h);
  save(DRAWN_KEY, drawn);
  renderDrawView();
}
function toggleDetail(s){
  openDetail[s] = !(openDetail[s] !== false);
  var det = document.getElementById("detail-"+s);
  if (det) det.classList.toggle("open");
  var card = document.getElementById("card-"+s);
  var btn = card ? card.querySelector(".toggle-detail") : null;
  if (btn) btn.textContent = openDetail[s] ? "收起做法 ▴" : "看具体做法 ▾";
}
function cardTap(e, s){
  if (e.target.closest && e.target.closest(".slot-btn")) return;
  toggleDetail(s);
}
function shareToday(){
  var l = [];
  ["breakfast","lunch","dinner"].forEach(function(s){
    if (drawn[s]) l.push(icoOf(s)+" "+slotOf(s)+" "+drawn[s].n+" · "+drawn[s].s);
  });
  var txt = l.length ? "三餐签筒 · 今日食谱 🎋\n\n" + l.join("\n") + "\n\n30天不重样: " + location.href
                    : "三餐签筒 · 今天抽个签,看看吃什么 🎋 " + location.href;
  if (navigator.share){
    navigator.share({title:"今日食谱", text:txt}).catch(function(){copyText(txt);});
  } else {
    copyText(txt);
  }
}
function copyText(t){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast("已复制,去粘贴吧 🎉")}).catch(function(){legacyCopy(t)});
  } else {
    legacyCopy(t);
  }
}
function legacyCopy(t){
  var ta = document.createElement("textarea");
  ta.value = t;
  ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  toast(ok ? "已复制,去粘贴吧 🎉" : "复制失败,请长按手动复制链接: " + location.href);
}
renderHeader();
renderDrawView();
</script>
