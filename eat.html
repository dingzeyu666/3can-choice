<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b08d57">
<meta name="description" content="三餐签筒 · 今天吃什么,抽个签吧">
<title>三餐签筒</title>
<style>
  :root{
    --gold:#b08d57; --gold-l:#d8b877; --gold-soft:#f3e7d2;
    --lav:#8e7cc3; --lav-soft:#ede8f7;
    --ink:#2e2a33; --muted:#8a8090; --card:rgba(255,255,255,.72);
    --line:rgba(255,255,255,.65); --shadow:0 12px 40px rgba(120,90,40,.12);
    --radius:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f7f3ee; color:var(--ink); min-height:100vh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(58% 42% at 12% 8%, rgba(216,184,119,.28), transparent 62%),
      radial-gradient(50% 38% at 90% 6%, rgba(142,124,195,.22), transparent 60%),
      radial-gradient(65% 45% at 55% 100%, rgba(232,201,216,.30), transparent 62%),
      linear-gradient(180deg,#faf6ef 0%,#f5f1f8 100%);
  }
  .header{position:relative;overflow:hidden;text-align:center;padding:calc(34px + env(safe-area-inset-top)) 20px 24px}
  .header::before{
    content:"♎";position:absolute;right:-14px;top:6px;font-size:110px;
    opacity:.10;transform:rotate(12deg);line-height:1;
  }
  .crown{font-size:15px;letter-spacing:6px;color:var(--gold);font-weight:600}
  .header h1{
    font-family:"Noto Serif SC","Songti SC",STSong,serif;
    font-size:34px;letter-spacing:8px;margin-top:6px;font-weight:700;
    background:linear-gradient(120deg,#8e7cc3 10%,#b08d57 45%,#c98b7a 75%,#8e7cc3 100%);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;animation:shine 6s linear infinite;
  }
  @keyframes shine{to{background-position:200% center}}
  .header .sub{margin-top:10px;font-size:13px;color:var(--muted);letter-spacing:2px}
  .header .date-chip{
    display:inline-flex;align-items:center;gap:6px;margin-top:14px;
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 16px;font-size:13px;box-shadow:0 4px 16px rgba(120,90,40,.08);
  }
  .wrap{padding:20px 16px 0}
  .draw-wrap{text-align:center;padding:8px 0 4px}
  .draw-hint{font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:22px}
  .draw-btn{
    position:relative;width:128px;height:128px;border:none;cursor:pointer;
    border-radius:50%;color:#fff;font-size:20px;font-weight:700;letter-spacing:6px;
    font-family:"Noto Serif SC","Songti SC",STSong,serif;
    background:radial-gradient(circle at 32% 28%,#e6c98a,#b08d57 55%,#8a6a3c);
    box-shadow:0 14px 44px rgba(176,141,87,.45),inset 0 2px 6px rgba(255,255,255,.5);
    transition:transform .2s;
  }
  .draw-btn::before{
    content:"";position:absolute;inset:-8px;border-radius:50%;
    border:1px solid rgba(176,141,87,.55);animation:pulse 2.4s ease-out infinite;
  }
  .draw-btn:active{transform:scale(.94)}
  .draw-btn.shaking{animation:shake .45s ease-in-out infinite}
  @keyframes shake{
    0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) translateY(-2px)}
    50%{transform:rotate(0) translateY(0)}75%{transform:rotate(4deg) translateY(-2px)}
  }
  @keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.28);opacity:0}}
  .draw-btn small{display:block;font-size:11px;letter-spacing:2px;opacity:.9;margin-top:2px}
  .draw-btn.shaking small{display:none}
  .shaking-text{display:none;font-size:12px;letter-spacing:3px}
  .draw-btn.shaking .shaking-text{display:block}

  .meals{margin-top:26px}
  .meal-card{
    position:relative;overflow:hidden;
    background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;margin-bottom:12px;
    box-shadow:var(--shadow);transition:border-color .3s;
    animation:cardIn .5s cubic-bezier(.2,.8,.3,1.1) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  .meal-card.revealed{border-color:rgba(176,141,87,.55);box-shadow:0 14px 44px rgba(176,141,87,.22)}
  .meal-card.roll{animation:roll 1.6s ease-in-out}
  @keyframes roll{
    0%{transform:rotate(0)}30%{transform:rotate(-1.5deg) translateX(-3px)}
    60%{transform:rotate(1.5deg) translateX(3px)}100%{transform:rotate(0)}
  }
  .meal-top{display:flex;align-items:center;gap:14px}
  .meal-ico{
    width:52px;height:52px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:linear-gradient(135deg,var(--gold-soft),var(--lav-soft));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);
  }
  .meal-info{flex:1;min-width:0}
  .meal-time{font-size:11px;color:var(--muted);letter-spacing:3px}
  .meal-name{
    font-family:"Noto Serif SC","Songti SC",STSong,serif;
    font-size:20px;font-weight:700;margin-top:3px;letter-spacing:1px;
  }
  .meal-name.rolling{color:var(--lav)}
  .dish-blocks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .dish-wrap{display:flex;flex-direction:column;align-items:center}
  .dish-block{
    font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.5px;
    background:linear-gradient(135deg,rgba(216,184,119,.22),rgba(142,124,195,.14));
    border:1px solid rgba(176,141,87,.4);border-radius:14px;padding:8px 14px;
    cursor:pointer;transition:.2s;box-shadow:0 2px 8px rgba(120,90,40,.08);
  }
  .dish-block:active{transform:scale(.94);background:rgba(216,184,119,.4)}
  .dish-block.on{background:linear-gradient(135deg,#d8b877,#b08d57);color:#fff}
  .dish-recipe{
    max-height:0;overflow:hidden;transition:max-height .35s ease;
    font-size:12px;line-height:1.7;color:#6b5f6e;margin-top:0;width:100%;
    background:rgba(255,255,255,.55);border-radius:10px;padding:0 10px;
    border:1px dashed rgba(176,141,87,.3);
  }
  .dish-recipe.open{max-height:160px;padding:8px 10px;margin-top:6px}
  .dish-recipe b{color:var(--gold)}
  .nu-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{
    font-size:11px;padding:4px 10px;border-radius:99px;letter-spacing:.5px;
    background:linear-gradient(135deg,var(--gold-soft),var(--lav-soft));
    color:#7a5a2e;border:1px solid rgba(176,141,87,.25);
  }
  .slot-btn{
    width:38px;height:38px;flex:none;border-radius:50%;border:1px solid rgba(176,141,87,.4);
    background:rgba(255,255,255,.5);color:var(--gold);cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;transition:.2s;
  }
  .slot-btn:active{transform:scale(.85);background:var(--gold-soft)}
  .slot-btn.on{background:linear-gradient(135deg,#d8b877,#b08d57);color:#fff;box-shadow:0 4px 14px rgba(176,141,87,.4)}
  .bottom-actions{display:flex;gap:10px;margin-top:18px}
  .btn{
    flex:1;border:none;cursor:pointer;border-radius:14px;padding:13px 0;font-size:14px;font-weight:600;
    letter-spacing:2px;transition:.2s;
  }
  .btn:active{transform:scale(.97)}
  .btn-ghost{background:var(--card);color:var(--muted);border:1px solid var(--line);box-shadow:0 4px 14px rgba(120,90,40,.08)}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
  .share-btn{
    display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:14px;
    background:linear-gradient(135deg,#8e7cc3,#b08d57);color:#fff;font-size:15px;font-weight:700;
    letter-spacing:3px;cursor:pointer;box-shadow:0 10px 30px rgba(142,124,195,.35);transition:.2s;
  }
  .share-btn:active{transform:scale(.98)}
  .overlay{
    position:fixed;inset:0;background:rgba(30,22,18,.55);z-index:90;
    display:none;align-items:center;justify-content:center;padding:24px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .overlay.show{display:flex}
  .share-panel{
    background:#fffdf8;border-radius:24px;padding:22px;width:100%;max-width:420px;
    text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.35);
    animation:fade .3s ease;
  }
  .share-panel img{width:100%;border-radius:14px;box-shadow:0 8px 24px rgba(120,90,40,.2)}
  .share-panel .hint{font-size:13px;color:#7a5a2e;margin-top:12px;line-height:1.7}
  .share-panel .hint b{color:var(--gold)}
  .share-actions{display:flex;gap:10px;margin-top:14px}
  .share-actions .btn{flex:1}
  .toast{
    position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:rgba(46,42,51,.92);color:#fff;font-size:13px;letter-spacing:1px;
    padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:99;
    box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:82%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="header">
  <div class="crown">♎ · L I B R A</div>
  <h1>三餐签筒</h1>
  <div class="sub">今日宜食 · 抽一支好签</div>
  <div class="date-chip" id="dateChip"></div>
  <div style="margin-top:8px;font-size:11px;color:rgba(176,141,87,.75);letter-spacing:2px">v8</div>
</div>

<div class="wrap">
  <div class="draw-wrap">
    <div class="draw-hint" id="drawHint">心诚则灵 · 轻轻一按</div>
    <button class="draw-btn" id="drawBtn" onclick="doDraw()">抽 签<small>三餐定数</small><span class="shaking-text">摇 签 中</span></button>
  </div>

  <div class="meals" id="mealList"></div>

  <div class="bottom-actions" id="bottomActions" style="display:none">
    <button class="btn btn-ghost" id="undoBtn" onclick="undoDraw()" disabled>↩ 反悔</button>
    <button class="btn btn-ghost" onclick="redrawAll()">🔄 全部重抽</button>
  </div>

  <button class="share-btn" onclick="shareToday()">📤 分享今日食谱</button>
</div>

<div class="overlay" id="shareOverlay">
  <div class="share-panel">
    <img id="shareImg" alt="食谱分享图">
    <div class="hint">手机:长按图片保存,再发给微信/QQ好友。<br>或点下方复制链接直接发送。</div>
    <div class="share-actions">
      <button class="btn btn-ghost" onclick="copyLink()">🔗 复制链接</button>
      <button class="btn btn-ghost" onclick="closeShare()">✕ 关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SIDE = {
  "米饭":"淘米加水,电饭煲煮至跳闸,再焖10分钟,粒粒分明。",
  "杂粮饭":"糙米黑米大米混合,提前泡30分钟,电饭煲正常煮饭。",
  "二米饭":"大米小米1:1混合,加水煮饭,软糯清香。",
  "藜麦饭":"藜麦冲洗后与大米同煮,口感Q弹营养高。",
  "糙米饭":"糙米提前泡1小时,加少许油煮饭,更软更香。",
  "红薯饭":"红薯切丁铺在米上同煮,出锅拌匀,自带甜味。",
  "小米粥":"小米洗净,加水煮20分钟至粘稠,可配南瓜或红枣。",
  "杂粮粥":"小米燕麦红豆等混合,提前泡发,慢熬至浓稠。",
  "山药粥":"山药去皮切段与大米同煮,30分钟搅匀成粥。",
  "玉米粥":"玉米碴洗净,煮40分钟至粘稠出香。",
  "南瓜粥":"南瓜切块与大米同煮至软烂,压成粥,微甜。",
  "燕麦粥":"燕麦片加水小火煮5分钟,可加牛奶更香浓。",
  "绿豆粥":"绿豆洗净煮至开花,加米再煮15分钟,清热解暑。",
  "薏米粥":"薏米提前泡2小时,加水煮40分钟至软糯。",
  "小米南瓜粥":"南瓜切丁与小米同煮20分钟,搅匀即可。",
  "紫薯粥":"紫薯切丁与大米同煮30分钟,搅匀成粥,颜色好看。",
  "豆浆":"黄豆泡6小时,豆浆机打成浆,煮沸滤渣,可加糖。",
  "牛奶":"隔水加热至温热,或直接饮用,配早餐正合适。",
  "水煮蛋":"鸡蛋冷水下锅,水开后再煮7分钟,过凉好剥壳。",
  "溏心蛋":"鸡蛋水开下锅煮6分钟,立即过凉,蛋黄流心。",
  "煎蛋":"平底锅少油,鸡蛋打散或整颗煎至边缘微焦。",
  "茶叶蛋":"鸡蛋煮熟敲裂,加茶叶酱油八角煮30分钟,泡一夜更入味。",
  "卤蛋":"鸡蛋煮熟剥壳,卤汁小火煮15分钟浸泡入味。",
  "咸鸭蛋":"直接对半切开即可,配白粥最搭。",
  "烤吐司":"吐司片放入面包机或烤箱,烤至两面金黄。",
  "油条":"买现炸油条,配豆浆或粥,切段蘸酱油更香。",
  "小油条":"买现炸的迷你油条,早餐配粥即食。",
  "苹果片":"苹果洗净带皮切薄片,脆甜爽口。",
  "蓝莓":"清水冲洗沥干即可,直接食用。",
  "圣女果":"洗净直接食用,或对半切开拌一点蜂蜜。",
  "小番茄":"洗净直接吃,一口一个,补充维生素。",
  "葡萄":"连皮用盐搓洗后冲净,冰镇更好吃。",
  "橙子":"切瓣或剥皮食用,维C满满。",
  "猕猴桃":"对半切开挖着吃,或去皮切片。",
  "水蜜桃":"洗净削皮,切块食用,多汁香甜。",
  "西瓜":"切块冰镇,夏季解暑神器。",
  "哈密瓜":"去皮去籽切块,冷藏后风味更佳。",
  "梨":"洗净带皮切块,清甜润燥。",
  "草莓":"盐水浸泡5分钟再冲净,去蒂食用。",
  "火龙果":"对半切开,用勺挖食,或切块。",
  "香蕉":"剥皮直接吃,能量补给站。",
  "凉拌菠菜":"菠菜焯水30秒挤干,加蒜末香醋生抽香油拌匀。",
  "焯拌菠菜":"菠菜焯水挤干,加蒜末、生抽、香醋拌匀。",
  "蒜蓉西兰花":"西兰花焯水1分钟,热油爆蒜蓉,加盐蚝油翻炒。",
  "白灼菜心":"菜心沸水烫1分钟,淋蒸鱼豉油,热油激香。",
  "清炒时蔬":"时蔬洗净,热锅少油大火快炒,盐调味断生即可。",
  "凉拌木耳":"木耳泡发焯水,加蒜末、香醋、生抽、香油拌匀。",
  "清炒油麦菜":"油麦菜大火快炒1分钟,蒜末盐调味即可出锅。",
  "焯拌莴笋":"莴笋切丝焯水,加蒜末、醋、生抽拌匀。",
  "炒芦笋":"芦笋切段焯水,热油快炒,盐和黑胡椒调味。",
  "凉拌藕片":"藕片焯水过凉,加香醋、糖、蒜末拌匀。",
  "拍黄瓜":"黄瓜拍碎,加蒜末、香醋、生抽、香油、辣椒油。",
  "凉拌黄瓜":"黄瓜拍块,蒜末香醋生抽拌匀,爽脆开胃。",
  "蒜蓉芥蓝":"芥蓝焯水,热油爆蒜蓉淋上,加蚝油。",
  "凉拌海带丝":"海带丝焯水,加蒜末、醋、生抽、香油拌匀。",
  "凉拌海带":"海带切丝焯水,醋蒜生抽拌匀,清爽。",
  "凉拌莴笋":"莴笋刨丝,盐腌10分钟挤水,香油拌匀。",
  "上汤娃娃菜":"娃娃菜焯水摆盘,皮蛋咸蛋煮汤浇上。",
  "白灼秋葵":"秋葵焯水2分钟对半切,淋豉油或蘸酱。",
  "蚝油生菜":"生菜烫10秒,淋蚝油蒜蓉汁。",
  "清炒小白菜":"小白菜大火快炒,蒜片盐调味。",
  "凉拌西葫芦":"西葫芦擦丝,加蒜末醋生抽,爽口。",
  "凉拌三丝":"土豆丝胡萝卜丝黄瓜丝焯水,蒜醋汁拌匀。",
  "清炒豆芽":"豆芽大火快炒1分钟,加醋和盐,脆嫩。",
  "炒芥蓝":"芥蓝斜切,热油加蒜片爆香快炒。",
  "清炒荷兰豆":"荷兰豆撕筋,大火快炒2分钟,盐调味。",
  "清炒豆苗":"豆苗大火快炒,加盐和少许糖,30秒出锅。",
  "清炒油菜":"油菜洗净,热锅爆蒜,快炒1分钟加盐。",
  "冬瓜汤":"冬瓜切片,加水煮开小火10分钟,盐和白胡椒调味。",
  "番茄汤":"番茄炒出沙加水煮开,盐调味,清淡开胃。",
  "紫菜汤":"紫菜虾皮冲入开水,点香油和葱花。",
  "紫菜蛋汤":"水开下紫菜,淋入蛋液成花,点香油。",
  "海带汤":"海带泡发切块,煮15分钟,盐调味。",
  "菌菇汤":"各类菌菇切片煮10分钟,盐和白胡椒调味。",
  "萝卜汤":"萝卜切块煮20分钟至透明,盐调味。",
  "山药汤":"山药切段煮15分钟,清甜绵软。",
  "蛋花汤":"水开淋入蛋液搅散,盐、香油、葱花。",
  "玉米汤":"玉米段煮15分钟,汤甜玉米香。",
  "酸辣汤":"豆腐木耳煮开,勾芡,加醋和胡椒。",
  "豆腐汤":"豆腐切块,加水煮5分钟,盐和白胡椒。",
  "冬瓜排骨汤":"排骨焯水与冬瓜同炖40分钟,盐调味。",
  "烫青菜":"青菜沸水烫30秒,淋豉油或蚝油。",
